<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Briefing · Marcelo Bastos</title>
<meta name="description" content="Responda pelo celular em poucos minutos. Com suas respostas eu monto o plano de conteúdo em vídeo da sua empresa.">
<meta property="og:type" content="website">
<meta property="og:title" content="Briefing · Marcelo Bastos">
<meta property="og:description" content="Responda pelo celular em poucos minutos. Com suas respostas eu monto o plano de conteúdo em vídeo da sua empresa.">
<meta property="og:image" content="https://briefing-marcelo-bastos.vercel.app/capa.png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta name="theme-color" content="#0B0B0B">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Source+Sans+3:wght@400;600;700&display=swap">
<style>
/* Layout: formulário simples em coluna única, uma etapa por tela, progresso no topo e botões ao alcance do polegar */
:root{
  /* paleta monocromática: preto, cinzas e branco */
  --bg:#FFFFFF;
  --wash:#F1F1F1;
  --surface:#F5F5F5;
  --ink:#111111;
  --muted:#6B6B6B;
  --line:#D4D4D4;
  --accent:#111111;
  --accent-2:#111111;
  --wa:#111111;
  --film:#0B0B0B;
  --on-accent:#FFFFFF;
  --err:#B42318;
  --font:"Source Sans 3","Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  color-scheme:light;
}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--font);font-size:17px;line-height:1.5;padding-inline:16px;-webkit-text-size-adjust:100%}
.wrap{max-width:580px;margin-inline:auto;padding-block:28px 128px}
p{margin:0}

/* topo: sequência de etapas */
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--film);color:#fff;margin-inline:-16px;padding:14px 16px 12px}
.brand{font-weight:600;font-size:.78rem;letter-spacing:.32em;text-transform:uppercase;color:#fff}
.bar-in{max-width:580px;margin-inline:auto;display:flex;flex-direction:column;gap:10px}
.bar-row{display:flex;justify-content:space-between;align-items:center;gap:12px;font-size:.9rem;color:rgba(255,255,255,.72)}
.bar-row strong{color:#fff;font-weight:700}
.segs{display:grid;gap:4px}
.segs span{height:4px;border-radius:2px;background:rgba(255,255,255,.2);transition:background .25s}
.segs span.on{background:#FFFFFF}

/* etapa */
.step{display:flex;flex-direction:column;gap:28px}
.step-head{display:flex;flex-direction:column;gap:8px;padding-bottom:18px;border-bottom:1px solid var(--line)}
h2{font-size:1.9rem;font-weight:700;line-height:1.1;margin:0;text-wrap:balance;color:var(--ink)}
.why{color:var(--muted);max-width:60ch}
.credit{text-align:center;font-size:.72rem;letter-spacing:.3em;text-transform:uppercase;color:var(--muted);padding-top:8px}

.q{display:flex;flex-direction:column;gap:8px}
.q>label,.q>.lbl{font-weight:700;line-height:1.35;font-size:1.04rem}
.req{color:var(--muted);margin-left:3px}
.hint{font-size:.93rem;color:var(--muted)}
.multi{align-self:flex-start;font-size:.88rem;color:#333333;background:#E9E9E9;border-radius:6px;padding:2px 9px;font-weight:700}
input[type=text],textarea{width:100%;font:inherit;font-size:16px;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:11px 13px;transition:border-color .15s,box-shadow .15s}
textarea{min-height:92px;resize:vertical;line-height:1.45}
input::placeholder,textarea::placeholder{color:var(--muted);opacity:.75}
input:focus,textarea:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px rgba(0,0,0,.12)}
.q.err input,.q.err textarea{border-color:var(--err)}
.errmsg{color:var(--err);font-size:.9rem}

.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{font:inherit;font-size:.97rem;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:9px 13px;cursor:pointer;line-height:1.25;text-align:left;-webkit-tap-highlight-color:transparent;transition:background .12s,border-color .12s,color .12s}
.chip:hover{border-color:var(--ink);background:var(--wash)}
.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--on-accent);}
.chips.is-multi .chip[aria-pressed="true"]::before{content:"✓ ";font-weight:700}
.chip:focus-visible,.btn:focus-visible,.linkbtn:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

.scale{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.scale .chip{text-align:center;padding:11px 0;font-weight:600;font-variant-numeric:tabular-nums}
.scale-ends{display:flex;justify-content:space-between;gap:12px;font-size:.88rem;color:var(--muted)}

/* revisão */
.review{display:flex;flex-direction:column;gap:22px}
.rsec{border-top:1px solid var(--line);padding-top:14px;display:flex;flex-direction:column;gap:10px}
.rsec-h{display:flex;justify-content:space-between;align-items:baseline;gap:12px}
.rsec-h h3{margin:0;font-size:1.08rem;font-weight:700;color:var(--accent)}
.linkbtn{font:inherit;font-size:.93rem;color:var(--accent);background:none;border:0;padding:4px 0;cursor:pointer;text-decoration:underline;text-underline-offset:3px}
.rrow{display:flex;flex-direction:column;gap:2px}
.rrow dt{font-size:.88rem;color:var(--muted)}
.rrow dd{margin:0;white-space:pre-wrap;overflow-wrap:anywhere}
.empty{color:var(--muted);font-size:.95rem}
.send{display:flex;flex-direction:column;gap:10px;background:var(--surface);border:1.5px solid var(--ink);border-radius:14px;padding:18px}
.send h3{margin:0;font-size:1.25rem;font-weight:700;color:var(--accent)}
.send p{color:var(--muted);font-size:.95rem}
.copyfield{font-size:14px;min-height:140px}
.sstep{display:grid;grid-template-columns:28px 1fr;gap:12px;padding-top:12px;border-top:1px solid var(--line)}
.snum{width:28px;height:28px;border-radius:50%;background:var(--accent);color:var(--on-accent);display:grid;place-items:center;font-weight:700;font-size:.95rem}
.sbody{display:flex;flex-direction:column;gap:8px;min-width:0}
.stitle{font-weight:600;color:var(--ink)!important;font-size:1rem!important}
.shint{font-size:.9rem!important}
.status{font-size:.93rem;font-weight:600;color:var(--ink)!important}
.status:empty{display:none}

/* botões */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;font:inherit;font-weight:600;font-size:1rem;border-radius:10px;padding:13px 18px;cursor:pointer;border:1px solid var(--line);background:var(--bg);color:var(--ink);text-decoration:none;-webkit-tap-highlight-color:transparent}
.btn.primary{background:var(--accent-2);border-color:var(--accent-2);color:#fff}
.btn.wa{background:var(--wa);border-color:var(--wa);color:#fff}
.btn.full{width:100%}
.btn svg{flex:none}

.dock{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--bg);border-top:1px solid var(--line);padding:12px 16px calc(10px + env(safe-area-inset-bottom,0px))}
.dock-in{max-width:580px;margin-inline:auto;display:flex;gap:10px}
.dock-in .primary{flex:1}
.saved{font-size:.8rem;color:var(--muted);text-align:center;margin-top:8px}

@media (prefers-reduced-motion:reduce){.segs span{transition:none}}
</style>
<style>html{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}[hidden]{display:none!important}img{max-width:100%}</style>
</head>
<body>

<header class="bar">
  <div class="bar-in">
    <div class="bar-row"><span class="brand">Marcelo Bastos</span><span><strong id="stepNum">Etapa 1 de 8</strong></span></div>
    <div class="segs" id="segs" aria-hidden="true"></div>
  </div>
</header>

<main class="wrap" id="app" aria-live="polite"></main>

<nav class="dock" id="dock" aria-label="Navegação do briefing">
  <div class="dock-in">
    <button class="btn" id="back" type="button" aria-label="Voltar">
      <svg width="18" height="18" viewBox="0 0 18 18" aria-hidden="true"><path d="M11 3 5 9l6 6" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
      Voltar
    </button>
    <button class="btn primary" id="next" type="button">Próximo</button>
  </div>
  <p class="saved">Suas respostas ficam salvas neste aparelho</p>
</nav>

<script>
/* WhatsApp do Marcelo (DDI + DDD + número, só dígitos) */
const WHATSAPP_MARCELO = "5551981231848";

const STEPS = [
 {id:"empresa", title:"A empresa", why:"Informações básicas para conhecer a empresa.", fields:[
  {id:"nome", type:"text", label:"Seu nome", req:true},
  {id:"cargo", type:"text", label:"Seu cargo na empresa", ph:"Ex.: sócio, gerente, marketing"},
  {id:"marca", type:"text", label:"Nome da empresa", req:true},
  {id:"insta", type:"text", label:"Instagram, site e outras redes", ph:"@suaempresa · www.suaempresa.com.br"},
  {id:"segmento", type:"text", label:"Qual é o ramo da empresa?", ph:"Ex.: restaurante, imobiliária, clínica de estética"},
  {id:"tamanho", type:"text", label:"Quantas pessoas trabalham na empresa?", ph:"Ex.: 12"},
  {id:"tempo", type:"chips", label:"Há quanto tempo a empresa existe?", opts:["Menos de 1 ano","1 a 3 anos","3 a 10 anos","Mais de 10 anos"]},
  {id:"oque", type:"area", label:"Descreva brevemente o que a empresa faz e para quem."},
  {id:"diferencial", type:"area", label:"Por que os clientes escolhem a sua empresa e não a concorrência?", hint:"Esse diferencial é o que os vídeos vão destacar."}
 ]},
 {id:"objetivo", title:"Objetivos", why:"O conteúdo mensal precisa trabalhar a favor de um objetivo claro.", fields:[
  {id:"objetivos", type:"chips", multi:true, label:"O que você espera do conteúdo em vídeo?", opts:["Vender mais","Tornar a empresa mais conhecida na região","Crescer o perfil com seguidores reais","Manter o movimento fora da temporada","Transmitir profissionalismo e confiança","Divulgar lançamentos e novidades","Ter material para anúncios pagos","Atrair bons profissionais para a equipe"], other:"Outro objetivo"},
  {id:"principal", type:"area", label:"Se tivesse que escolher apenas um objetivo, qual seria? Por quê?"},
  {id:"dor", type:"area", label:"Qual é o maior desafio hoje?", ph:"Ex.: o perfil está parado, falta tempo para produzir conteúdo, o movimento cai fora da temporada"},
  {id:"sucesso", type:"chips", multi:true, label:"Como você vai perceber que o trabalho está dando resultado?", opts:["Mais mensagens no WhatsApp ou direct","Mais seguidores","Mais visualizações nos Reels","Mais clientes na empresa","Mais reservas ou agendamentos","Mais vendas","Clientes comentando sobre os vídeos"], other:"Outro indicador"},
  {id:"datas", type:"area", label:"Quais datas são importantes para a empresa ao longo do ano?", hint:"Por exemplo: temporada de verão, Dia das Mães, aniversário da empresa, Black Friday, Natal, feiras e eventos. Essas datas orientam o calendário de conteúdo."}
 ]},
 {id:"publico", title:"Público", why:"Cada público pede uma abordagem diferente.", fields:[
  {id:"cliente", type:"area", label:"Descreva o cliente ideal da empresa.", hint:"Idade, profissão, interesses e o motivo pelo qual procura a empresa."},
  {id:"idade", type:"chips", multi:true, label:"Faixa etária principal", opts:["Até 24 anos","25 a 34","35 a 44","45 a 59","60 ou mais"]},
  {id:"origem", type:"chips", label:"Quem é o público na maior parte do ano?", opts:["Moradores do litoral","Veranistas (Porto Alegre, Serra, interior)","Turistas de fora do RS","Um pouco de cada","Outras empresas"]},
  {id:"sazonal", type:"chips", label:"O movimento da empresa muda ao longo do ano?", opts:["Muito mais forte no verão","Um pouco mais forte no verão","Constante o ano todo","Mais forte fora do verão"], other:"Outro período", otherPh:"Descreva o período mais forte ou mais fraco"},
  {id:"perguntas", type:"area", label:"Quais perguntas os clientes fazem com mais frequência?", hint:"Perguntas frequentes costumam render bons vídeos."}
 ]},
 {id:"perfil", title:"Redes sociais hoje", why:"Um retrato de como está a presença da empresa nas redes.", fields:[
  {id:"nota", type:"scale", label:"Que nota você dá para o perfil da empresa hoje?", ends:["Precisa de muita atenção","Estamos satisfeitos"]},
  {id:"frequencia", type:"chips", label:"Com que frequência a empresa publica?", opts:["Quase nunca","1 vez por semana","2 a 3 vezes por semana","Todos os dias"]},
  {id:"quemcuida", type:"chips", label:"Quem cuida das redes sociais hoje?", opts:["O proprietário ou sócio","Alguém da equipe","Agência ou social media","Ninguém no momento"]},
  {id:"anuncio", type:"chips", label:"A empresa investe em anúncios pagos?", opts:["Sim, todos os meses","De vez em quando","Ainda não, mas pretende","Não pretende"]},
  {id:"gosta", type:"area", label:"O que funciona bem no perfil hoje?"},
  {id:"naogosta", type:"area", label:"O que você gostaria de melhorar?"},
  {id:"jafez", type:"chips", label:"A empresa já trabalhou com videomaker?", opts:["Sim, e a experiência foi boa","Sim, mas não atendeu às expectativas","Não"]},
  {id:"jafez_obs", type:"area", label:"Se desejar, conte como foi a experiência."}
 ]},
 {id:"conteudo", title:"Linha de conteúdo", why:"No pacote mensal, alguns tipos de vídeo se repetem e formam a linha de conteúdo da empresa.", fields:[
  {id:"conteudos", type:"chips", multi:true, label:"Quais tipos de vídeo fazem sentido para a empresa?", opts:["Bastidores do dia a dia","Produtos ou serviços em detalhe","Depoimentos de clientes","Dicas e conteúdo educativo","Tendências e humor","Apresentação da equipe","Tour pelo espaço","Antes e depois","Novidades e lançamentos","Cobertura de eventos","História da empresa (institucional)"], other:"Outra ideia"},
  {id:"formatos", type:"chips", multi:true, label:"Em quais canais os vídeos serão publicados?", opts:["Instagram (Reels)","Stories","Feed e carrossel","TikTok","YouTube","Site","LinkedIn","Anúncios pagos","WhatsApp"]},
  {id:"rosto", type:"chips", multi:true, label:"Quem pode aparecer nos vídeos?", opts:["Proprietários ou sócios","A equipe","Clientes (com autorização)","Ninguém, apenas o espaço e os produtos"]},
  {id:"camera", type:"chips", label:"Quem vai aparecer se sente à vontade para falar para a câmera?", opts:["Sim, com naturalidade","Sim, com um pouco de orientação","Prefere aparecer sem falar","Ainda não sabemos"]},
  {id:"personalidade", type:"chips", multi:true, label:"Como a empresa quer ser vista pelo público?", hint:"Pense na personalidade da marca. A linguagem e o estilo de cada vídeo ficam a cargo do videomaker.", opts:["Próxima e acolhedora","Moderna e inovadora","Tradicional e confiável","Sofisticada","Leve e bem-humorada","Especialista no que faz","Familiar","Jovem e dinâmica"], other:"Outra característica"}
 ]},
 {id:"refs", title:"Referências e restrições", why:"Referências ajudam a alinhar expectativas. Saber o que evitar é igualmente importante.", fields:[
  {id:"referencias", type:"area", label:"Perfis de empresas que você admira", hint:"Cole links ou @. Podem ser de qualquer segmento."},
  {id:"concorrentes", type:"area", label:"Quem são os principais concorrentes? O que você acha do conteúdo deles?"},
  {id:"identidade", type:"chips", label:"A empresa possui identidade visual?", opts:["Sim, com manual de marca","Logo e cores definidas","Apenas o logo","Ainda não"]},
  {id:"cores", type:"text", label:"Cores e fontes da marca, se souber", ph:"Ex.: azul-marinho e branco"},
  {id:"proibido", type:"area", label:"Há algo que não pode aparecer nos vídeos?", hint:"Assuntos, cores, tipos de humor, concorrentes, áreas da empresa."},
  {id:"frase", type:"area", label:"Qual mensagem o público deve guardar sobre a empresa?"}
 ]},
 {id:"rotina", title:"Rotina de produção", why:"Como o trabalho vai funcionar no dia a dia.", fields:[
  {id:"quantidade", type:"chips", label:"Quantos vídeos por mês a empresa imagina?", opts:["4 (1 por semana)","8 (2 por semana)","12 (3 por semana)","16 ou mais","Gostaria de uma sugestão"]},
  {id:"diarias", type:"chips", label:"Como a empresa prefere organizar as gravações?", hint:"Em uma diária é gravado material para vários vídeos.", opts:["1 diária por mês","2 diárias por mês","Gravações semanais","Gostaria de uma sugestão"]},
  {id:"dias", type:"chips", multi:true, label:"Melhores dias e horários para gravar", opts:["Segunda a sexta, manhã","Segunda a sexta, tarde","Sábado","Domingo"]},
  {id:"aprova", type:"text", label:"Quem aprova os vídeos?", ph:"Ex.: proprietário, sócia, gerente de marketing"},
  {id:"contato", type:"text", label:"Quem será o contato no dia a dia?", ph:"Nome e cargo"}
 ]},
 {id:"inicio", title:"Início e observações", why:"Para finalizar, só mais duas perguntas.", fields:[
  {id:"inicio", type:"text", label:"Quando gostaria de começar?", ph:"Ex.: em outubro, antes da temporada, em janeiro"},
  {id:"extra", type:"area", label:"Deseja acrescentar alguma informação?"}
 ]}
];
const TOTAL = STEPS.length;

/* ============ ESTADO ============ */
const KEY = "mb-briefing-empresas-v3";
let S = {step:0, a:{}};
try{ const raw = localStorage.getItem(KEY); if(raw){ const p = JSON.parse(raw); if(p && typeof p==="object" && p.a){ S = p; if(!(S.step>=0)) S.step = 0; } } }catch(e){}
let saveT;
function save(){ clearTimeout(saveT); saveT = setTimeout(()=>{ try{ localStorage.setItem(KEY, JSON.stringify(S)); }catch(e){} },250); }

const $ = s => document.querySelector(s);
const app = $("#app");
const esc = s => String(s??"").replace(/[&<>"']/g, c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));

$("#segs").style.gridTemplateColumns = `repeat(${TOTAL},1fr)`;
$("#segs").innerHTML = STEPS.map(()=>"<span></span>").join("");

/* ============ RENDER ============ */
function render(){
  const st = S.step, review = st>=TOTAL;
  document.querySelectorAll("#segs span").forEach((el,i)=>el.classList.toggle("on", i<=st));
  $("#stepNum").textContent = review ? "Revisão" : `Etapa ${st+1} de ${TOTAL}`;
  $("#back").hidden = st===0;
  $("#dock").hidden = review;
  $("#next").textContent = st===TOTAL-1 ? "Revisar respostas" : "Próximo";
  if(review){ app.innerHTML = reviewHTML(); wireReview(); }
  else app.innerHTML = stepHTML(STEPS[st]);
}

function stepHTML(s){
  return `<section class="step">
    <div class="step-head"><h2>${esc(s.title)}</h2><p class="why">${esc(s.why)}</p></div>
    ${s.fields.map(fieldHTML).join("")}
  </section>`;
}

function fieldHTML(f){
  const v = S.a[f.id];
  const req = f.req ? `<span class="req" aria-hidden="true">*</span>` : "";
  const hint = f.hint ? `<p class="hint" id="${f.id}-h">${esc(f.hint)}</p>` : "";
  const desc = f.hint ? `aria-describedby="${f.id}-h"` : "";
  if(f.type==="text"){
    return `<div class="q" data-q="${f.id}"><label for="${f.id}">${esc(f.label)}${req}</label>${hint}
      <input id="${f.id}" type="text" ${f.id==="nome"?'autocomplete="name"':''} value="${esc(v)}" placeholder="${esc(f.ph||"")}" ${desc}></div>`;
  }
  if(f.type==="area"){
    return `<div class="q" data-q="${f.id}"><label for="${f.id}">${esc(f.label)}${req}</label>${hint}
      <textarea id="${f.id}" rows="3" placeholder="${esc(f.ph||"")}" ${desc}>${esc(v)}</textarea></div>`;
  }
  if(f.type==="chips"){
    const sel = f.multi ? (Array.isArray(v)?v:[]) : (v?[v]:[]);
    const opts = [...f.opts]; if(f.other) opts.push(f.other);
    const otherOn = f.other && sel.includes(f.other);
    return `<div class="q" data-q="${f.id}"><span class="lbl" id="${f.id}-l">${esc(f.label)}${req}</span>
      ${f.multi?`<p class="multi">Você pode marcar mais de uma opção.</p>`:""}${hint}
      <div class="chips${f.multi?" is-multi":""}" role="group" aria-labelledby="${f.id}-l">
        ${opts.map(o=>`<button type="button" class="chip" data-f="${f.id}" data-v="${esc(o)}" aria-pressed="${sel.includes(o)}">${esc(o)}</button>`).join("")}
      </div>
      ${f.other?`<input id="${f.id}_outro" type="text" placeholder="${esc(f.otherPh||"Descreva aqui")}" value="${esc(S.a[f.id+"_outro"])}" ${otherOn?"":"hidden"} aria-label="${esc(f.other)}">`:""}
    </div>`;
  }
  if(f.type==="scale"){
    return `<div class="q" data-q="${f.id}"><span class="lbl" id="${f.id}-l">${esc(f.label)}</span>
      <div class="scale" role="group" aria-labelledby="${f.id}-l">
        ${[1,2,3,4,5].map(n=>`<button type="button" class="chip" data-f="${f.id}" data-v="${n}" aria-pressed="${String(v)===String(n)}">${n}</button>`).join("")}
      </div>
      <div class="scale-ends"><span>1 · ${esc(f.ends[0])}</span><span style="text-align:right">5 · ${esc(f.ends[1])}</span></div></div>`;
  }
  return "";
}

/* ============ EVENTOS ============ */
function findField(id){ for(const s of STEPS) for(const f of s.fields) if(f.id===id) return f; }
app.addEventListener("click", e=>{
  const chip = e.target.closest(".chip[data-f]");
  if(chip){
    const f = findField(chip.dataset.f), val = chip.dataset.v;
    if(f.multi){
      const arr = Array.isArray(S.a[f.id]) ? S.a[f.id] : [];
      S.a[f.id] = arr.includes(val) ? arr.filter(x=>x!==val) : [...arr, val];
    } else {
      S.a[f.id] = String(S.a[f.id])===val ? "" : (f.type==="scale" ? Number(val) : val);
    }
    const sel = f.multi ? S.a[f.id] : [String(S.a[f.id])];
    chip.parentElement.querySelectorAll(".chip").forEach(c=>c.setAttribute("aria-pressed", sel.includes(c.dataset.v)));
    if(f.other){ const o = document.getElementById(f.id+"_outro"); const on = sel.includes(f.other); o.hidden = !on; if(on && val===f.other) o.focus(); }
    save(); return;
  }
  const ed = e.target.closest("[data-edit]");
  if(ed) go(+ed.dataset.edit);
});
app.addEventListener("input", e=>{
  const el = e.target;
  if(!el.id || el.classList.contains("copyfield") || !el.matches("input,textarea")) return;
  S.a[el.id] = el.value; save();
  const q = el.closest(".q");
  if(q && q.classList.contains("err") && el.value.trim()){ q.classList.remove("err"); q.querySelector(".errmsg")?.remove(); }
});

function go(n){
  S.step = n; save(); render();
  window.scrollTo({top:0, behavior: matchMedia("(prefers-reduced-motion: reduce)").matches ? "auto" : "smooth"});
}
$("#next").addEventListener("click", ()=>{
  const missing = STEPS[S.step].fields.filter(f=>f.req && !String(S.a[f.id]||"").trim());
  if(missing.length){
    missing.forEach(f=>{ const q = app.querySelector(`[data-q="${f.id}"]`); if(q && !q.classList.contains("err")){ q.classList.add("err"); q.insertAdjacentHTML("beforeend",`<p class="errmsg">Campo obrigatório.</p>`);} });
    document.getElementById(missing[0].id)?.focus();
    return;
  }
  go(S.step+1);
});
$("#back").addEventListener("click", ()=>{ if(S.step>0) go(S.step-1); });

/* ============ RESUMO ============ */
function fmt(f){
  const v = S.a[f.id];
  if(f.type==="chips"){
    let arr = f.multi ? (Array.isArray(v)?v:[]) : (v?[v]:[]);
    if(!arr.length) return "";
    const o = String(S.a[f.id+"_outro"]||"").trim();
    return arr.map(x => x===f.other ? (o || f.other) : x).join(", ");
  }
  if(f.type==="scale") return v ? `${v} de 5` : "";
  return String(v||"").trim();
}
function buildText(){
  const nome = String(S.a.nome||"").trim(), marca = String(S.a.marca||"").trim();
  let out = `*BRIEFING DE CONTEÚDO MENSAL · Marcelo Bastos*\n${marca||"(empresa)"}${nome?` · ${nome}`:""}\n`;
  STEPS.forEach((s,i)=>{
    const rows = s.fields.map(f=>[f,fmt(f)]).filter(r=>r[1]);
    if(!rows.length) return;
    out += `\n*${i+1}. ${s.title.toUpperCase()}*\n`;
    rows.forEach(([f,val])=>{ out += `*${f.label.replace(/[.?]$/,"").replace(/\*/g,"")}:* ${val}\n`; });
  });
  return out.trim();
}
function reviewHTML(){
  const secs = STEPS.map((s,i)=>{
    const rows = s.fields.map(f=>[f,fmt(f)]).filter(r=>r[1]);
    return `<div class="rsec"><div class="rsec-h"><h3>${i+1}. ${esc(s.title)}</h3><button type="button" class="linkbtn" data-edit="${i}">Editar</button></div>
      ${rows.length ? `<dl style="margin:0;display:flex;flex-direction:column;gap:10px">${rows.map(([f,val])=>`<div class="rrow"><dt>${esc(f.label)}</dt><dd>${esc(val)}</dd></div>`).join("")}</dl>` : `<p class="empty">Nenhuma resposta nesta etapa.</p>`}</div>`;
  }).join("");
  return `<section class="step">
    <div class="step-head"><h2>Confira suas respostas</h2><p class="why">Para alterar alguma resposta, toque em Editar.</p></div>
    <div class="send">
      <h3>Enviar para Marcelo Bastos</h3>
      <p>O botão abre o WhatsApp com as respostas já preenchidas. Basta tocar em enviar.</p>
      <a class="btn wa full" id="waBtn" href="https://wa.me/5551981231848" target="_blank" rel="noopener">
        <svg width="20" height="20" viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M12 2a10 10 0 0 0-8.6 15.1L2 22l5-1.3A10 10 0 1 0 12 2Zm0 18.2a8.2 8.2 0 0 1-4.2-1.1l-.3-.2-3 .8.8-2.9-.2-.3A8.2 8.2 0 1 1 12 20.2Zm4.5-6.1c-.2-.1-1.5-.7-1.7-.8s-.4-.1-.6.1-.7.8-.8 1-.3.2-.5.1a6.7 6.7 0 0 1-3.3-2.9c-.3-.4.3-.4.7-1.3.1-.2 0-.3 0-.4l-.8-1.8c-.2-.5-.4-.4-.6-.4h-.5a1 1 0 0 0-.7.3 3 3 0 0 0-.9 2.2 5.1 5.1 0 0 0 1.1 2.7 11.6 11.6 0 0 0 4.4 3.9c1.6.7 2.3.8 3.1.6a2.7 2.7 0 0 0 1.8-1.2 2.2 2.2 0 0 0 .2-1.3c-.1-.1-.3-.2-.5-.3Z"/></svg>
        Enviar pelo WhatsApp</a>
      <button type="button" class="btn full" id="copyBtn">Copiar respostas</button>
      <p class="status" id="status" role="status"></p>
      <textarea class="copyfield" id="copyText" readonly hidden aria-label="Texto das respostas"></textarea>
    </div>
    <div class="review">${secs}</div>
    <button type="button" class="btn full" id="backEdit">Voltar para a última etapa</button>
    <p class="credit">Marcelo Bastos · Videomaker · Litoral Norte RS</p>
  </section>`;
}
function wireReview(){
  const text = buildText();
  const shortUrl = `https://wa.me/${WHATSAPP_MARCELO}`;
  const fullUrl = `${shortUrl}?text=${encodeURIComponent(text)}`;
  const wa = $("#waBtn");
  wa.href = fullUrl;
  wa.addEventListener("click", ()=>{
    $("#status").textContent = "Se o WhatsApp não abrir, toque em Copiar respostas e cole na conversa com Marcelo Bastos: (51) 98123-1848.";
  });
  $("#copyBtn").addEventListener("click", ()=>{
    const ta = $("#copyText"); ta.value = text;
    const fallback = ()=>{ ta.hidden = false; ta.focus(); ta.select(); $("#status").textContent = "Texto selecionado abaixo. Copie e cole na conversa."; };
    if(navigator.clipboard && navigator.clipboard.writeText){
      navigator.clipboard.writeText(text).then(()=>{ $("#status").textContent = "Respostas copiadas. Cole na conversa com Marcelo Bastos: (51) 98123-1848."; }, fallback);
    } else fallback();
  });
  $("#backEdit").addEventListener("click", ()=>go(TOTAL-1));
}

render();
</script>
